<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- 背景圆形 - 奶油色 -->
  <circle cx="64" cy="64" r="58" fill="#FFFBF0" stroke="#EA580C" stroke-width="8" stroke-dasharray="10,8"/>
  
  <!-- 打开的书本 -->
  <g transform="translate(64, 70)">
    <!-- 左页 -->
    <path d="M -35 -25 Q -35 -30, -30 -32 L -5 -35 L -5 20 L -30 18 Q -35 17, -35 12 Z" 
          fill="#FFF" stroke="#EA580C" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- 右页 -->
    <path d="M 5 -35 L 30 -32 Q 35 -30, 35 -25 L 35 12 Q 35 17, 30 18 L 5 20 Z" 
          fill="#FFF" stroke="#EA580C" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- 书脊 -->
    <ellipse cx="0" cy="-34" rx="5" ry="2" fill="#EA580C" opacity="0.5"/>
    <rect x="-2.5" y="-34" width="5" height="54" fill="#EA580C" opacity="0.35"/>
    
    <!-- 左页装饰线条 -->
    <line x1="-28" y1="-22" x2="-10" y2="-23" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="-28" y1="-15" x2="-10" y2="-16" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="-28" y1="-8" x2="-10" y2="-9" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- 右页装饰线条 -->
    <line x1="10" y1="-23" x2="28" y2="-22" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="10" y1="-16" x2="28" y2="-15" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="10" y1="-9" x2="28" y2="-8" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- 创意元素 - 魔法星星 -->
  <g transform="translate(30, 35)">
    <path d="M 0 -6 L 1.5 -2 L 6 -1 L 2 2 L 2.5 6.5 L 0 4 L -2.5 6.5 L -2 2 L -6 -1 L -1.5 -2 Z" 
          fill="#F97316" stroke="#FFFBF0" stroke-width="2"/>
  </g>
  
  <g transform="translate(98, 45)">
    <path d="M 0 -4.5 L 1 -1.5 L 4.5 -0.5 L 1.5 1.5 L 2 5 L 0 3 L -2 5 L -1.5 1.5 L -4.5 -0.5 L -1 -1.5 Z" 
          fill="#F97316" stroke="#FFFBF0" stroke-width="2"/>
  </g>
  
  <g transform="translate(95, 85)">
    <path d="M 0 -3.5 L 0.8 -1 L 3.5 -0.5 L 1 1 L 1.5 3.5 L 0 2.5 L -1.5 3.5 L -1 1 L -3.5 -0.5 L -0.8 -1 Z" 
          fill="#F97316" stroke="#FFFBF0" stroke-width="1.5"/>
  </g>
  
  <!-- 工坊工具图标 - 小扳手 -->
  <g transform="translate(32, 85) rotate(-20)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#EA580C"/>
    <circle cx="0" cy="-9" r="3" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  </g>
</svg>
